<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Candy Crush</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --red: #ff4757;
    --orange: #ffa502;
    --yellow: #fffa65;
    --green: #2ed573;
    --blue: #1e90ff;
    --purple: #a55eea;
    --pink: #ff6b81;
    --bg-start: #0a0612;
    --bg-mid: #1a0b2e;
    --bg-end: #0f061a;
    --panel: rgba(45, 27, 78, 0.7);
    --panel-border: rgba(255,107,129,0.25);
    --accent: #ff6b81;
    --accent-glow: rgba(255,107,129,0.6);
    --cell-size: 70px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    background: var(--bg-start);
    color: #fff;
    font-family: 'Poppins', system-ui, -apple-system, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }

  /* Cinematic animated background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 120% 80% at 0% 0%, rgba(167,94,234,0.15) 0%, transparent 50%),
      radial-gradient(ellipse 100% 70% at 100% 0%, rgba(30,144,255,0.12) 0%, transparent 50%),
      radial-gradient(ellipse 80% 60% at 50% 100%, rgba(255,107,129,0.1) 0%, transparent 50%);
    animation: bg-shift 20s ease-in-out infinite alternate;
    z-index: -2;
  }

  @keyframes bg-shift {
    0% { transform: translateX(-5%) translateY(3%); }
    50% { transform: translateX(3%) translateY(-2%); }
    100% { transform: translateX(-3%) translateY(-5%); }
  }

  /* Floating orbs */
  .orb {
    position: fixed;
    border-radius: 50%;
    filter: blur(60px);
    z-index: -1;
    animation: orb-float 30s ease-in-out infinite;
  }

  .orb-1 {
    width: 400px; height: 400px;
    background: rgba(167,94,234,0.25);
    top: -100px; left: -100px;
    animation-delay: 0s;
  }

  .orb-2 {
    width: 350px; height: 350px;
    background: rgba(30,144,255,0.2);
    bottom: -80px; right: -80px;
    animation-delay: -10s;
  }

  .orb-3 {
    width: 300px; height: 300px;
    background: rgba(255,107,129,0.2);
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    animation-delay: -20s;
  }

  @keyframes orb-float {
    0%, 100% { transform: translate(0, 0) scale(1); opacity: 0.6; }
    25% { transform: translate(50px, -30px) scale(1.1); opacity: 0.8; }
    50% { transform: translate(-20px, 40px) scale(0.95); opacity: 0.5; }
    75% { transform: translate(-60px, -20px) scale(1.05); opacity: 0.7; }
  }

  /* Noise grain overlay */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background:
      repeating-linear-gradient(90deg, transparent 0 1px, rgba(255,255,255,0.015) 1px 2px),
      repeating-linear-gradient(0deg, transparent 0 1px, rgba(255,255,255,0.015) 1px 2px);
    pointer-events: none;
    z-index: -1;
  }

  .game-wrapper {
    display: flex;
    gap: 24px;
    align-items: flex-start;
    padding: 24px;
    max-width: 960px;
    width: 100%;
    position: relative;
    z-index: 1;
  }

  /* SIDE PANEL */
  .side-panel {
    display: flex;
    flex-direction: column;
    gap: 18px;
    min-width: 200px;
  }

  .panel-card {
    background: var(--panel);
    backdrop-filter: blur(20px) saturate(1.8);
    border: 1px solid var(--panel-border);
    border-radius: 20px;
    padding: 20px;
    text-align: center;
    position: relative;
    overflow: hidden;
    box-shadow:
      0 8px 32px rgba(0,0,0,0.4),
      inset 0 1px 0 rgba(255,255,255,0.08);
    transition: all 0.3s ease;
  }

  .panel-card:hover {
    border-color: rgba(255,107,129,0.35);
    box-shadow:
      0 12px 40px rgba(0,0,0,0.5),
      inset 0 1px 0 rgba(255,255,255,0.1);
  }

  .panel-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
  }

  .panel-card::after {
    content: '';
    position: absolute;
    inset: -50%;
    background: radial-gradient(circle at 30% 20%, rgba(255,255,255,0.08) 0%, transparent 60%);
    pointer-events: none;
  }

  .panel-card h3 {
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.4);
    margin-bottom: 8px;
    position: relative;
    z-index: 1;
  }

  .panel-card .value {
    font-size: 32px;
    font-weight: 900;
    color: var(--accent);
    text-shadow: 0 0 30px var(--accent-glow);
    position: relative;
    z-index: 1;
  }

  .level-badge {
    display: inline-block;
    background: linear-gradient(135deg, #ff6b81, #a55eea);
    border-radius: 50px;
    padding: 6px 18px;
    font-size: 13px;
    font-weight: 700;
    margin-top: 6px;
    box-shadow: 0 4px 15px rgba(255,107,129,0.3);
    position: relative;
    z-index: 1;
  }

  .moves-bar {
    display: flex;
    justify-content: center;
    gap: 6px;
    margin-top: 10px;
    flex-wrap: wrap;
    position: relative;
    z-index: 1;
  }

  .move-dot {
    width: 12px; height: 12px;
    border-radius: 50%;
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.15);
    transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .move-dot.used {
    background: linear-gradient(135deg, var(--accent), #a55eea);
    border-color: transparent;
    box-shadow: 0 0 12px var(--accent-glow);
    transform: scale(1.2);
  }

  .goal-list {
    list-style: none;
    text-align: left;
    position: relative;
    z-index: 1;
  }

  .goal-list li {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 13px;
    font-weight: 500;
    padding: 6px 0;
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }

  .goal-list li:last-child { border-bottom: none; }

  .goal-icon {
    width: 24px; height: 24px;
    border-radius: 50%;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px;
  }

  .goal-progress {
    margin-left: auto;
    font-weight: 700;
    font-size: 12px;
    letter-spacing: -0.3px;
  }

  .goal-done { color: #2ed573; text-shadow: 0 0 10px rgba(46,213,115,0.5); }
  .goal-pending { color: rgba(255,255,255,0.35); }

  /* Boost buttons */
  .boosts {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    position: relative;
    z-index: 1;
  }

  .boost-btn {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 14px;
    padding: 12px 6px;
    color: #fff;
    cursor: pointer;
    font-size: 22px;
    text-align: center;
    transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    position: relative;
    overflow: hidden;
  }

  .boost-btn::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, transparent 0%, rgba(255,255,255,0.05) 100%);
    opacity: 0;
    transition: opacity 0.25s;
  }

  .boost-btn:hover {
    background: rgba(255,107,129,0.15);
    border-color: var(--accent);
    transform: translateY(-3px) scale(1.02);
    box-shadow: 0 8px 20px rgba(255,107,129,0.25);
  }

  .boost-btn:hover::before { opacity: 1; }

  .boost-btn.active {
    background: rgba(255,107,129,0.25);
    border-color: var(--accent);
    box-shadow:
      0 0 0 2px rgba(255,107,129,0.3),
      0 4px 15px rgba(255,107,129,0.3),
      inset 0 0 20px rgba(255,107,129,0.1);
  }

  .boost-btn .boost-name {
    display: block;
    font-size: 9px;
    font-weight: 600;
    letter-spacing: 0.5px;
    opacity: 0.4;
    margin-top: 3px;
    text-transform: uppercase;
    position: relative;
  }

  /* MAIN GAME AREA */
  .game-main {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    flex: 1;
  }

  .game-title {
    font-size: 40px;
    font-weight: 900;
    background: linear-gradient(135deg, #ff6b81, #ffa502, #ff6b81);
    background-size: 200%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: shimmer 3s infinite ease;
    letter-spacing: -2px;
    filter: drop-shadow(0 0 20px rgba(255,107,129,0.3));
  }

  @keyframes shimmer {
    0%, 100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
  }

  /* BOARD */
  .board-container {
    position: relative;
  }

  .board-glow {
    position: absolute;
    inset: -15px;
    border-radius: 24px;
    background:
      radial-gradient(ellipse, rgba(255,107,129,0.12) 0%, transparent 70%),
      radial-gradient(ellipse at 50% 50%, rgba(167,94,234,0.08) 0%, transparent 60%);
    pointer-events: none;
    filter: blur(20px);
  }

  #board {
    display: grid;
    grid-template-columns: repeat(8, var(--cell-size));
    grid-template-rows: repeat(8, var(--cell-size));
    gap: 5px;
    background: rgba(0,0,0,0.5);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 22px;
    padding: 12px;
    position: relative;
    user-select: none;
    box-shadow:
      0 20px 60px rgba(0,0,0,0.5),
      inset 0 1px 0 rgba(255,255,255,0.1),
      inset 0 -1px 0 rgba(0,0,0,0.3);
  }

  .cell {
    width: var(--cell-size);
    height: var(--cell-size);
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    position: relative;
    transition: transform 0.1s;
    background: rgba(255,255,255,0.02);
  }

  .cell:hover {
    background: rgba(255,255,255,0.04);
  }

  .candy {
    width: 56px;
    height: 56px;
    border-radius: 16px;
    position: relative;
    transition: transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    font-weight: 700;
    cursor: pointer;
    box-shadow:
      0 6px 20px rgba(0,0,0,0.4),
      inset 0 -4px 8px rgba(0,0,0,0.3),
      inset 0 4px 8px rgba(255,255,255,0.2);
    border: 2px solid rgba(0,0,0,0.15);
  }

  .candy::before {
    content: '';
    position: absolute;
    inset: -3px;
    border-radius: 20px;
    background: inherit;
    filter: blur(15px);
    opacity: 0.4;
    z-index: -1;
  }

  .candy::after {
    content: '';
    position: absolute;
    top: 8px; left: 10px;
    width: 16px; height: 10px;
    background: rgba(255,255,255,0.45);
    border-radius: 50%;
    transform: rotate(-30deg);
    filter: blur(2px);
  }

  /* Candy colors - enhanced gradients */
  .candy-0 {
    background: radial-gradient(circle at 30% 25%, #ff7875, var(--red));
    box-shadow: 0 6px 20px rgba(255,71,87,0.5), inset 0 -4px 8px rgba(0,0,0,0.3), inset 0 4px 8px rgba(255,255,255,0.2);
  }

  .candy-1 {
    background: radial-gradient(circle at 30% 25%, #ffbb76, var(--orange));
    box-shadow: 0 6px 20px rgba(255,165,2,0.5), inset 0 -4px 8px rgba(0,0,0,0.3), inset 0 4px 8px rgba(255,255,255,0.2);
  }

  .candy-2 {
    background: radial-gradient(circle at 30% 25%, #ffdfd5, var(--yellow));
    box-shadow: 0 6px 20px rgba(255,250,101,0.5), inset 0 -4px 8px rgba(0,0,0,0.3), inset 0 4px 8px rgba(255,255,255,0.2);
  }

  .candy-3 {
    background: radial-gradient(circle at 30% 25%, #5ae7b8, var(--green));
    box-shadow: 0 6px 20px rgba(46,213,115,0.5), inset 0 -4px 8px rgba(0,0,0,0.3), inset 0 4px 8px rgba(255,255,255,0.2);
  }

  .candy-4 {
    background: radial-gradient(circle at 30% 25%, #6ec4ff, var(--blue));
    box-shadow: 0 6px 20px rgba(30,144,255,0.5), inset 0 -4px 8px rgba(0,0,0,0.3), inset 0 4px 8px rgba(255,255,255,0.2);
  }

  .candy-5 {
    background: radial-gradient(circle at 30% 25%, #c48bf4, var(--purple));
    box-shadow: 0 6px 20px rgba(165,94,234,0.5), inset 0 -4px 8px rgba(0,0,0,0.3), inset 0 4px 8px rgba(255,255,255,0.2);
  }

  /* Special candy types - enhanced */
  .candy-striped-h::before,
  .candy-striped-v::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 16px;
    pointer-events: none;
    mix-blend-mode: overlay;
  }

  .candy-striped-h::before {
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 7px,
      rgba(255,255,255,0.35) 7px,
      rgba(255,255,255,0.35) 10px
    );
  }

  .candy-striped-v::before {
    background: repeating-linear-gradient(
      90deg,
      transparent,
      transparent 7px,
      rgba(255,255,255,0.35) 7px,
      rgba(255,255,255,0.35) 10px
    );
  }

  .candy-wrapped {
    border: 3px solid rgba(255,255,255,0.7) !important;
    box-shadow:
      0 0 20px rgba(255,255,255,0.6),
      0 6px 20px rgba(0,0,0,0.4),
      inset 0 -4px 8px rgba(0,0,0,0.3),
      inset 0 4px 8px rgba(255,255,255,0.2) !important;
    animation: wrapped-pulse 2s ease-in-out infinite;
  }

  @keyframes wrapped-pulse {
    0%, 100% { box-shadow: 0 0 20px rgba(255,255,255,0.6), 0 6px 20px rgba(0,0,0,0.4), inset 0 -4px 8px rgba(0,0,0,0.3), inset 0 4px 8px rgba(255,255,255,0.2); }
    50% { box-shadow: 0 0 30px rgba(255,255,255,0.8), 0 6px 20px rgba(0,0,0,0.4), inset 0 -4px 8px rgba(0,0,0,0.3), inset 0 4px 8px rgba(255,255,255,0.2); }
  }

  .candy-bomb {
    background: radial-gradient(circle at 30% 25%, #666, #1a1a1a) !important;
    border: 3px solid #999 !important;
    font-size: 24px !important;
    box-shadow: 0 6px 20px rgba(0,0,0,0.6), inset 0 -4px 8px rgba(0,0,0,0.5), inset 0 4px 8px rgba(255,255,255,0.1) !important;
    animation: bomb-glow 1.5s ease-in-out infinite;
  }

  @keyframes bomb-glow {
    0%, 100% { filter: brightness(1); }
    50% { filter: brightness(1.2); }
  }

  /* State animations - enhanced */
  .candy.selected {
    transform: scale(1.2);
    box-shadow:
      0 0 35px rgba(255,255,255,0.8),
      0 8px 25px rgba(0,0,0,0.5),
      inset 0 -4px 8px rgba(0,0,0,0.3),
      inset 0 4px 8px rgba(255,255,255,0.2) !important;
    z-index: 10;
    animation: selected-pulse 0.6s ease-in-out infinite;
  }

  @keyframes selected-pulse {
    0%, 100% { transform: scale(1.2); }
    50% { transform: scale(1.25); }
  }

  .candy.hint {
    animation: pulse-hint 0.9s infinite ease-in-out;
  }

  @keyframes pulse-hint {
    0%, 100% { transform: scale(1); filter: brightness(1); }
    50% { transform: scale(1.12); filter: brightness(1.3) drop-shadow(0 0 15px rgba(255,255,0,0.8)); }
  }

  .candy.matched {
    animation: pop-out 0.4s cubic-bezier(0.6, 0.04, 0.98, 0.335) forwards;
  }

  @keyframes pop-out {
    0% { transform: scale(1) rotate(0deg); opacity: 1; }
    40% { transform: scale(1.4) rotate(10deg); opacity: 0.9; }
    60% { transform: scale(1.1) rotate(-5deg); opacity: 0.5; }
    100% { transform: scale(0) rotate(0deg); opacity: 0; }
  }

  .candy.falling {
    animation: fall-in 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  @keyframes fall-in {
    from { transform: translateY(-40px) scale(0.7) rotate(10deg); opacity: 0; }
    to { transform: translateY(0) scale(1) rotate(0deg); opacity: 1; }
  }

  .candy.swap-right { animation: swap-r 0.22s cubic-bezier(0.34, 1.56, 0.64, 1); }
  .candy.swap-left  { animation: swap-l 0.22s cubic-bezier(0.34, 1.56, 0.64, 1); }
  .candy.swap-up    { animation: swap-u 0.22s cubic-bezier(0.34, 1.56, 0.64, 1); }
  .candy.swap-down  { animation: swap-d 0.22s cubic-bezier(0.34, 1.56, 0.64, 1); }

  @keyframes swap-r { 0% { transform: translateX(-70px); } 100% { transform: none; } }
  @keyframes swap-l { 0% { transform: translateX(70px);  } 100% { transform: none; } }
  @keyframes swap-u { 0% { transform: translateY(70px);  } 100% { transform: none; } }
  @keyframes swap-d { 0% { transform: translateY(-70px); } 100% { transform: none; } }

  /* Enhanced visual effects */
  .blast-h {
    position: absolute;
    top: 50%; left: 0; right: 0;
    height: 6px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.95), transparent);
    transform: translateY(-50%);
    animation: blast-h 0.35s ease-out forwards;
    pointer-events: none;
    z-index: 20;
    box-shadow: 0 0 20px rgba(255,255,255,0.8);
  }

  @keyframes blast-h {
    from { opacity: 1; height: 6px; filter: blur(2px); }
    to { opacity: 0; height: 30px; filter: blur(4px); }
  }

  .blast-v {
    position: absolute;
    left: 50%; top: 0; bottom: 0;
    width: 6px;
    background: linear-gradient(0deg, transparent, rgba(255,255,255,0.95), transparent);
    transform: translateX(-50%);
    animation: blast-v 0.35s ease-out forwards;
    pointer-events: none;
    z-index: 20;
    box-shadow: 0 0 20px rgba(255,255,255,0.8);
  }

  @keyframes blast-v {
    from { opacity: 1; width: 6px; filter: blur(2px); }
    to { opacity: 0; width: 30px; filter: blur(4px); }
  }

  /* Enhanced score popup */
  .score-popup {
    position: absolute;
    font-size: 22px;
    font-weight: 900;
    color: #fff;
    text-shadow:
      0 0 20px rgba(255,107,129,0.9),
      0 2px 4px rgba(0,0,0,0.5);
    pointer-events: none;
    z-index: 100;
    animation: float-up 1.1s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
  }

  @keyframes float-up {
    0%   { transform: translateY(0) scale(0.4) rotate(-5deg); opacity: 0; }
    30%  { transform: translateY(-50px) scale(1.3) rotate(3deg); opacity: 1; }
    100% { transform: translateY(-90px) scale(0.9) rotate(0deg); opacity: 0; }
  }

  /* Enhanced combo banner */
  .combo-banner {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    background: linear-gradient(135deg, #ff6b81, #a55eea);
    border: 2px solid rgba(255,255,255,0.3);
    border-radius: 16px;
    padding: 12px 30px;
    font-size: 28px;
    font-weight: 900;
    letter-spacing: 1px;
    z-index: 200;
    animation: combo-pop 0.9s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    white-space: nowrap;
    pointer-events: none;
    box-shadow:
      0 0 40px rgba(255,107,129,0.6),
      0 10px 40px rgba(0,0,0,0.4);
  }

  @keyframes combo-pop {
    0%   { transform: translate(-50%, -50%) scale(0) rotate(-10deg); opacity: 0; }
    40%  { transform: translate(-50%, -50%) scale(1.3) rotate(5deg); opacity: 1; }
    60%  { transform: translate(-50%, -50%) scale(1.1) rotate(-2deg); opacity: 1; }
    100% { transform: translate(-50%, -90px) scale(0.85) rotate(0deg); opacity: 0; }
  }

  /* Status bar - enhanced */
  .status-bar {
    display: flex;
    gap: 12px;
    width: 100%;
  }

  .status-chip {
    background: var(--panel);
    backdrop-filter: blur(15px);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 60px;
    padding: 8px 18px;
    font-size: 13px;
    font-weight: 600;
    flex: 1;
    text-align: center;
    transition: all 0.3s;
    box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    letter-spacing: -0.3px;
  }

  .status-chip span { color: var(--accent); font-weight: 800; }

  /* OVERLAY - enhanced */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.88);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 500;
    backdrop-filter: blur(12px) saturate(1.5);
  }

  .overlay.hidden { display: none; }

  .modal {

<body>

<script>
// ═══════════════════════════════════════════════════════════
// CONSTANTS
// ═══════════════════════════════════════════════════════════
const COLS = 8, ROWS = 8;
const NUM_COLORS = 6;
const CANDY_EMOJIS = ['🔴','🟠','🟡','🟢','🔵','🟣'];

// Candy types
const T = { NORMAL: 'n', STRIPED_H: 'sh', STRIPED_V: 'sv', WRAPPED: 'w', BOMB: 'b' };

// Levels config
const LEVELS = [
  { goal: 5000,  moves: 20, colorGoals: { 0: 10, 3: 10 } },
  { goal: 10000, moves: 22, colorGoals: { 1: 12, 4: 12 } },
  { goal: 15000, moves: 24, colorGoals: { 2: 15, 5: 15 } },
  { goal: 20000, moves: 26, colorGoals: { 0: 20, 2: 20 } },
  { goal: 30000, moves: 28, colorGoals: { 3: 25, 5: 25 } },
  { goal: 40000, moves: 30, colorGoals: {} },
  { goal: 60000, moves: 32, colorGoals: {} },
  { goal: 80000, moves: 34, colorGoals: {} },
  { goal: 100000, moves: 36, colorGoals: {} },
  { goal: 150000, moves: 40, colorGoals: {} },
];

// ═══════════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════════
let board = [];       // {color, type, el, matched}
let selected = null;  // {r, c}
let busy = false;
let score = 0;
let bestScore = parseInt(localStorage.getItem('cc_best') || '0');
let moves = 0;
let maxMoves = 20;
let level = 0;
let lives = 3;
let combo = 0;
let colorCounts = {};   // colors cleared this level
let colorGoals = {};    // target color counts for level
let boostActive = null; // 'lollipop' | 'bomb' | 'color'
let hintTimeout = null;
let hintCells = [];
let audioCtx = null;

// ═══════════════════════════════════════════════════════════
// AUDIO
// ═══════════════════════════════════════════════════════════
function getAudioCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}

function playTone(freq, type = 'sine', duration = 0.1, vol = 0.2) {
  try {
    const ctx = getAudioCtx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(freq * 0.8, ctx.currentTime + duration);
    gain.gain.setValueAtTime(vol, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(ctx.currentTime);
    osc.stop(ctx.currentTime + duration);
  } catch(e) {}
}

function playMatch(size, comboN) {
  const freqs = [261, 294, 330, 349, 392, 440, 494, 523];
  const idx = Math.min(size - 3 + comboN, freqs.length - 1);
  playTone(freqs[idx], 'triangle', 0.15, 0.25);
}

function playSwap() { playTone(200, 'sine', 0.06, 0.1); }
function playFail()  { playTone(150, 'square', 0.2, 0.15); }
function playWin()   {
  [523, 659, 784, 1047].forEach((f, i) =>
    setTimeout(() => playTone(f, 'triangle', 0.3, 0.3), i * 120)
  );
}
function playLose() { playTone(130, 'sawtooth', 0.5, 0.2); }

// ═══════════════════════════════════════════════════════════
// PARTICLE SYSTEM
// ═══════════════════════════════════════════════════════════
const canvas = document.getElementById('particles');
const pctx = canvas.getContext('2d');
let particles = [];

function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

const CANDY_COLORS_HEX = ['#ff4757','#ffa502','#fffa65','#2ed573','#1e90ff','#a55eea'];

function spawnParticles(x, y, color, count = 10) {
  for (let i = 0; i < count; i++) {
    const angle = (Math.PI * 2 / count) * i + Math.random() * 0.5;
    const speed = 2 + Math.random() * 4;
    particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed - 2,
      r: 4 + Math.random() * 5,
      color: CANDY_COLORS_HEX[color] || '#ff6b81',
      alpha: 1,
      life: 0.9 + Math.random() * 0.5
    });
  }
}

function animateParticles() {
  pctx.clearRect(0, 0, canvas.width, canvas.height);
  particles = particles.filter(p => p.alpha > 0.01);
  for (const p of particles) {
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.12;
    p.alpha -= 0.02 / p.life;
    pctx.globalAlpha = p.alpha;
    pctx.fillStyle = p.color;
    pctx.shadowColor = p.color;
    pctx.shadowBlur = 10;
    pctx.beginPath();
    pctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    pctx.fill();
    pctx.shadowBlur = 0;
  }
  pctx.globalAlpha = 1;
  requestAnimationFrame(animateParticles);
}
animateParticles();

// ═══════════════════════════════════════════════════════════
// BOARD SETUP
// ═══════════════════════════════════════════════════════════
const boardEl = document.getElementById('board');

function createCandy(color, type = T.NORMAL) {
  return { color, type, el: null, matched: false };
}

function randomColor() {
  return Math.floor(Math.random() * NUM_COLORS);
}

function initBoard() {
  board = [];
  for (let r = 0; r < ROWS; r++) {
    board[r] = [];
    for (let c = 0; c < COLS; c++) {
      let color;
      do {
        color = randomColor();
      } while (
        (c >= 2 && board[r][c-1].color === color && board[r][c-2].color === color) ||
        (r >= 2 && board[r-1][c].color === color && board[r-2][c].color === color)
      );
      board[r][c] = createCandy(color);
    }
  }
}

function renderBoard() {
  boardEl.innerHTML = '';
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const cellEl = document.createElement('div');
      cellEl.className = 'cell';
      cellEl.dataset.r = r;
      cellEl.dataset.c = c;

      const candy = board[r][c];
      const candyEl = makeCandyEl(candy.color, candy.type);
      candy.el = candyEl;

      cellEl.appendChild(candyEl);
      cellEl.addEventListener('click', () => onCellClick(r, c));
      cellEl.addEventListener('touchend', e => { e.preventDefault(); onCellClick(r, c); }, { passive: false });
      boardEl.appendChild(cellEl);
    }
  }
}

function makeCandyEl(color, type = T.NORMAL) {
  const el = document.createElement('div');
  el.className = `candy candy-${color}`;

  if (type === T.STRIPED_H) el.classList.add('candy-striped-h');
  if (type === T.STRIPED_V) el.classList.add('candy-striped-v');
  if (type === T.WRAPPED) el.classList.add('candy-wrapped');
  if (type === T.BOMB) {
    el.classList.add('candy-bomb');
    el.textContent = '💣';
  }

  return el;
}

function getCellEl(r, c) {
  return boardEl.children[r * COLS + c];
}

function refreshCandyEl(r, c) {
  const candy = board[r][c];
  const cellEl = getCellEl(r, c);
  if (!cellEl) return;
  const oldEl = candy.el;
  if (oldEl && oldEl.parentNode === cellEl) cellEl.removeChild(oldEl);
  const newEl = makeCandyEl(candy.color, candy.type);
  candy.el = newEl;
  cellEl.appendChild(newEl);
}

// ═══════════════════════════════════════════════════════════
// MATCH DETECTION
// ═══════════════════════════════════════════════════════════
function findMatches() {
  const matched = new Set();
  const specialCreations = []; // {r, c, type}

  // Horizontal
  for (let r = 0; r < ROWS; r++) {
    let run = 1;
    for (let c = 1; c <= COLS; c++) {
      const same = c < COLS && board[r][c].color === board[r][c-1].color
                   && board[r][c].type !== T.BOMB && board[r][c-1].type !== T.BOMB;
      if (same) {
        run++;
      } else {
        if (run >= 3) {
          for (let k = c - run; k < c; k++) matched.add(`${r},${k}`);
          if (run === 4) specialCreations.push({ r, c: c - 2, type: T.STRIPED_H });
          if (run === 5) specialCreations.push({ r, c: c - 3, type: T.BOMB });
          if (run > 5)   specialCreations.push({ r, c: c - Math.floor(run/2), type: T.BOMB });
        }
        run = 1;
      }
    }
  }

  // Vertical
  for (let c = 0; c < COLS; c++) {
    let run = 1;
    for (let r = 1; r <= ROWS; r++) {
      const same = r < ROWS && board[r][c].color === board[r-1][c].color
                   && board[r][c].type !== T.BOMB && board[r-1][c].type !== T.BOMB;
      if (same) {
        run++;
      } else {
        if (run >= 3) {
          for (let k = r - run; k < r; k++) matched.add(`${k},${c}`);
          if (run === 4) specialCreations.push({ r: r - 2, c, type: T.STRIPED_V });
          if (run === 5) specialCreations.push({ r: r - 3, c, type: T.BOMB });
          if (run > 5)   specialCreations.push({ r: r - Math.floor(run/2), c, type: T.BOMB });
        }
        run = 1;
      }
    }
  }

  // T / L shapes → wrapped
  detectTL(matched, specialCreations);

  return { matched, specialCreations };
}

function detectTL(matched, specialCreations) {
  for (const key of matched) {
    const [r, c] = key.split(',').map(Number);
    let inH = false, inV = false;
    if ((matchSet.has(`${r},${c-1}`) || matchSet.has(`${r},${c+1}`))) inH = true;
    if ((matchSet.has(`${r-1},${c}`) || matchSet.has(`${r+1},${c}`))) inV = true;
    if (inH && inV) {
      if (!specialCreations.find(s => s.r === r && s.c === c)) {
        specialCreations.push({ r, c, type: T.WRAPPED });
      }
    }
  }
}

// ═══════════════════════════════════════════════════════════
// SPECIAL CANDY EFFECTS
// ═══════════════════════════════════════════════════════════
function activateSpecial(r, c, extraMatched) {
  const candy = board[r][c];
  if (candy.type === T.NORMAL) return;

  if (candy.type === T.STRIPED_H) {
    addBlast(r, c, 'h');
    for (let cc = 0; cc < COLS; cc++) extraMatched.add(`${r},${cc}`);
  }
  if (candy.type === T.STRIPED_V) {
    addBlast(r, c, 'v');
    for (let rr = 0; rr < ROWS; rr++) extraMatched.add(`${rr},${c}`);
  }
  if (candy.type === T.WRAPPED) {
    for (let dr = -1; dr <= 1; dr++)
      for (let dc = -1; dc <= 1; dc++) {
        const nr = r + dr, nc = c + dc;
        if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS) extraMatched.add(`${nr},${nc}`);
      }
  }
  if (candy.type === T.BOMB) {
    const targetColor = candy.color;
    for (let rr = 0; rr < ROWS; rr++)
      for (let cc = 0; cc < COLS; cc++)
        if (board[rr][cc].color === targetColor) extraMatched.add(`${rr},${cc}`);
  }
}

function addBlast(r, c, dir) {
  const cellEl = getCellEl(r, c);
  if (!cellEl) return;
  const blast = document.createElement('div');
  blast.className = dir === 'h' ? 'blast-h' : 'blast-v';
  cellEl.appendChild(blast);
  setTimeout(() => blast.remove(), 450);
}

// ═══════════════════════════════════════════════════════════
// SWAP & GAME LOGIC
// ═══════════════════════════════════════════════════════════
function onCellClick(r, c) {
  if (busy) return;

  // Boost modes
  if (boostActive === 'lollipop') {
    useBoostLollipop(r, c);
    return;
  }
  if (boostActive === 'bomb') {
    useBoostBomb(r, c);
    return;
  }
  if (boostActive === 'color') {
    useBoostColor(r, c);
    return;
  }

  clearHint();

  if (!selected) {
    selected = { r, c };
    board[r][c].el && board[r][c].el.classList.add('selected');
  } else {
    const dr = Math.abs(r - selected.r);
    const dc = Math.abs(c - selected.c);
    if ((dr === 1 && dc === 0) || (dr === 0 && dc === 1)) {
      const from = selected;
      selected = null;
      trySwap(from.r, from.c, r, c);
    } else if (r === selected.r && c === selected.c) {
      board[r][c].el && board[r][c].el.classList.remove('selected');
      selected = null;
    } else {
      board[selected.r][selected.c].el && board[selected.r][selected.c].el.classList.remove('selected');
      selected = { r, c };
      board[r][c].el && board[r][c].el.classList.add('selected');
    }
  }
}

async function trySwap(r1, c1, r2, c2) {
  busy = true;
  clearSelection();
  playSwap();

  animateSwap(r1, c1, r2, c2);

  const tmp = board[r1][c1];
  board[r1][c1] = board[r2][c2];
  board[r2][c2] = tmp;

  await delay(240);

  const { matched } = findMatches();

  if (matched.size === 0) {
    playFail();
    animateSwap(r1, c1, r2, c2, true);
    const tmp2 = board[r1][c1];
    board[r1][c1] = board[r2][c2];
    board[r2][c2] = tmp2;
    await delay(240);
    busy = false;
    scheduleHint();
    return;
  }

  moves--;
  combo = 0;
  updateUI();
  await processMatches();
  busy = false;

  if (moves <= 0 && !checkWin()) {
    endLevel(false);
  } else if (checkWin()) {
    await delay(350);
    endLevel(true);
  } else {
    scheduleHint();
  }
}

function animateSwap(r1, c1, r2, c2, reverse = false) {
  const el1 = board[r1][c1].el;
  const el2 = board[r2][c2].el;
  if (!el1 || !el2) return;

  let a1, a2;
  if (r1 === r2) {
    a1 = c2 > c1 ? 'swap-right' : 'swap-left';
    a2 = c2 > c1 ? 'swap-left' : 'swap-right';
  } else {
    a1 = r2 > r1 ? 'swap-down' : 'swap-up';
    a2 = r2 > r1 ? 'swap-up' : 'swap-down';
  }

  if (reverse) { const t = a1; a1 = a2; a2 = t; }

  el1.classList.add(a1);
  el2.classList.add(a2);
  el1.addEventListener('animationend', () => el1.classList.remove(a1), { once: true });
  el2.addEventListener('animationend', () => el2.classList.remove(a2), { once: true });
}

async function processMatches() {
  let anyMatch = true;

  while (anyMatch) {
    let { matched, specialCreations } = findMatches();

    const extraMatched = new Set();
    for (const key of matched) {
      const [r, c] = key.split(',').map(Number);
      if (board[r][c].type !== T.NORMAL) {
        activateSpecial(r, c, extraMatched);
      }
    }
    for (const k of extraMatched) matched.add(k);

    if (matched.size === 0) {
      anyMatch = false;
      break;
    }

    combo++;
    const pts = matched.size * 65 * combo;
    score += pts;
    if (score > bestScore) {
      bestScore = score;
      localStorage.setItem('cc_best', bestScore);
    }

    playMatch(matched.size, combo);
    if (combo > 1) showComboBanner(combo);

    for (const key of matched) {
      const [r, c] = key.split(',').map(Number);
      const color = board[r][c].color;
      colorCounts[color] = (colorCounts[color] || 0) + 1;
    }

    markAndAnimate(matched, pts, specialCreations);
    await delay(380);

    for (const sc of specialCreations) {
      if (matched.has(`${sc.r},${sc.c}`)) {
        board[sc.r][sc.c].type = sc.type;
        board[sc.r][sc.c].matched = false;
      }
    }

    removeMatched(matched, specialCreations);

    await delay(60);
    await applyGravity();
    await delay(60);
    refillBoard();
    await delay(180);

    updateUI();
  }
}

function markAndAnimate(matched, pts, specialCreations) {
  for (const key of matched) {
    const [r, c] = key.split(',').map(Number);
    const candy = board[r][c];
    candy.matched = true;
    if (candy.el) {
      candy.el.classList.remove('selected', 'hint');
      candy.el.classList.add('matched');
    }

    const cellEl = getCellEl(r, c);
    if (cellEl) {
      const rect = cellEl.getBoundingClientRect();
      const popup = document.createElement('div');
      popup.className = 'score-popup';
      popup.textContent = `+${pts}`;
      popup.style.left = rect.left + rect.width / 2 - 25 + 'px';
      popup.style.top = rect.top + 'px';
      document.body.appendChild(popup);
      popup.addEventListener('animationend', () => popup.remove(), { once: true });

      spawnParticles(rect.left + rect.width / 2, rect.top + rect.height / 2, board[r][c].color, 12);
    }
  }
}

function removeMatched(matched, specialCreations) {
  const protectedKeys = new Set(specialCreations.map(s => `${s.r},${s.c}`));

  for (const key of matched) {
    if (protectedKeys.has(key)) {
      const [r, c] = key.split(',').map(Number);
      board[r][c].matched = false;
      refreshCandyEl(r, c);
      continue;
    }
    const [r, c] = key.split(',').map(Number);
    board[r][c] = null;
    const cellEl = getCellEl(r, c);
    if (cellEl) cellEl.innerHTML = '';
  }
}

async function applyGravity() {
  let moved = false;
  for (let c = 0; c < COLS; c++) {
    let writeRow = ROWS - 1;
    for (let r = ROWS - 1; r >= 0; r--) {
      if (board[r][c] !== null) {
        if (writeRow !== r) {
          board[writeRow][c] = board[r][c];
          board[r][c] = null;
          moved = true;
        }
        writeRow--;
      }
    }
  }

  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const cellEl = getCellEl(r, c);
      if (!cellEl) continue;
      if (board[r][c] === null) {
        cellEl.innerHTML = '';
      } else {
        const existing = cellEl.firstChild;
        if (!existing || existing !== board[r][c].el) {
          cellEl.innerHTML = '';
          if (board[r][c].el) cellEl.appendChild(board[r][c].el);
        }
      }
    }
  }
  if (moved) await delay(200);
}

function refillBoard() {
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      if (board[r][c] === null) {
        const color = randomColor();
        board[r][c] = createCandy(color);
        const cellEl = getCellEl(r, c);
        if (cellEl) {
          const el = makeCandyEl(color);
          el.classList.add('falling');
          el.addEventListener('animationend', () => el.classList.remove('falling'), { once: true });
          board[r][c].el = el;
          cellEl.appendChild(el);
        }
      }
    }
  }
}

// ═══════════════════════════════════════════════════════════
// WIN / LOSE
// ═══════════════════════════════════════════════════════════
function checkWin() {
  const lvl = LEVELS[level];
  if (score < lvl.goal) return false;
  for (const [col, target] of Object.entries(lvl.colorGoals)) {
    if ((colorCounts[col] || 0) < target) return false;
  }
  return true;
}

function endLevel(win) {
  busy = true;
  const lvl = LEVELS[level];
  const overlay = document.getElementById('overlay');
  const icon = document.getElementById('modal-icon');
  const title = document.getElementById('modal-title');
  const stars = document.getElementById('modal-stars');
  const scoreEl = document.getElementById('modal-score');
  const msg = document.getElementById('modal-msg');
  const btn1 = document.getElementById('modal-btn1');
  const btn2 = document.getElementById('modal-btn2');

  if (win) {
    playWin();
    icon.textContent = '🎉';
    title.textContent = 'Level Complete!';
    scoreEl.textContent = score.toLocaleString();

    const ratio = score / lvl.goal;
    let starCount = 1;
    if (ratio >= 1.5) starCount = 2;
    if (ratio >= 2.0) starCount = 3;
    stars.textContent = '⭐'.repeat(starCount) + '☆'.repeat(3 - starCount);

    const msgs = ['Sweet!', 'Delicious!', 'You crushed it!', 'Candy master!', 'Incredible!'];
    msg.textContent = msgs[Math.floor(Math.random() * msgs.length)];

    if (level < LEVELS.length - 1) {
      btn1.textContent = 'Next Level';
      btn1.onclick = () => { overlay.classList.add('hidden'); level++; startLevel(); };
    } else {
      btn1.textContent = 'Play Again';
      btn1.onclick = () => { overlay.classList.add('hidden'); level = 0; startLevel(); };
    }
    btn2.textContent = 'Retry';
    btn2.onclick = () => { overlay.classList.add('hidden'); startLevel(); };
  } else {
    playLose();
    lives--;
    icon.textContent = lives > 0 ? '😢' : '💔';
    title.textContent = lives > 0 ? 'Out of Moves!' : 'Game Over';
    scoreEl.textContent = score.toLocaleString();
    stars.textContent = '';
    msg.textContent = lives > 0
      ? `You needed ${lvl.goal.toLocaleString()} points. So close!`
      : 'No lives left. Start fresh?';

    if (lives > 0) {
      btn1.textContent = 'Try Again';
      btn1.onclick = () => { overlay.classList.add('hidden'); startLevel(); };
    } else {
      lives = 3;
      btn1.textContent = 'New Game';
      btn1.onclick = () => { overlay.classList.add('hidden'); level = 0; score = 0; startLevel(); };
    }
    btn2.textContent = 'Skip Level';
    btn2.onclick = () => {
      overlay.classList.add('hidden');
      if (level < LEVELS.length - 1) level++;
      startLevel();
    };
  }

  overlay.classList.remove('hidden');
}

// ═══════════════════════════════════════════════════════════
// BOOSTS
// ═══════════════════════════════════════════════════════════
document.getElementById('boost-lollipop').addEventListener('click', () => toggleBoost('lollipop'));
document.getElementById('boost-shuffle').addEventListener('click', doShuffle);
document.getElementById('boost-bomb').addEventListener('click', () => toggleBoost('bomb'));
document.getElementById('boost-color').addEventListener('click', () => toggleBoost('color'));

function toggleBoost(name) {
  if (busy) return;
  boostActive = boostActive === name ? null : name;
  document.querySelectorAll('.boost-btn').forEach(b => {
    b.classList.remove('active');
    b.style.background = '';
  });
  if (boostActive) {
    const map = { lollipop: 'boost-lollipop', bomb: 'boost-bomb', color: 'boost-color' };
    const btn = document.getElementById(map[boostActive]);
    if (btn) btn.classList.add('active');
  }
}

async function useBoostLollipop(r, c) {
  boostActive = null;
  document.querySelectorAll('.boost-btn').forEach(b => {
    b.classList.remove('active');
    b.style.background = '';
  });
  busy = true;
  const candy = board[r][c];
  const cellEl = getCellEl(r, c);
  const rect = cellEl.getBoundingClientRect();
  spawnParticles(rect.left + rect.width/2, rect.top + rect.height/2, candy.color, 18);
  if (candy.el) candy.el.classList.add('matched');
  score += 120;
  await delay(380);
  board[r][c] = null;
  cellEl.innerHTML = '';
  await applyGravity();
  refillBoard();
  await processMatches();
  updateUI();
  busy = false;
  scheduleHint();
}

async function useBoostBomb(r, c) {
  boostActive = null;
  document.querySelectorAll('.boost-btn').forEach(b => {
    b.classList.remove('active');
    b.style.background = '';
  });
  busy = true;
  const toRemove = new Set();
  for (let dr = -1; dr <= 1; dr++)
    for (let dc = -1; dc <= 1; dc++) {
      const nr = r+dr, nc = c+dc;
      if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS) toRemove.add(`${nr},${nc}`);
    }
  markAndAnimate(toRemove, 60, []);
  score += toRemove.size * 60;
  await delay(380);
  for (const key of toRemove) {
    const [rr, cc] = key.split(',').map(Number);
    board[rr][cc] = null;
    const cel = getCellEl(rr, cc);
    if (cel) cel.innerHTML = '';
  }
  await applyGravity();
  refillBoard();
  await processMatches();
  updateUI();
  busy = false;
  scheduleHint();
}

async function useBoostColor(r, c) {
  boostActive = null;
  document.querySelectorAll('.boost-btn').forEach(b => {
    b.classList.remove('active');
    b.style.background = '';
  });
  busy = true;
  const targetColor = board[r][c].color;
  const toRemove = new Set();
  for (let rr = 0; rr < ROWS; rr++)
    for (let cc = 0; cc < COLS; cc++)
      if (board[rr][cc] && board[rr][cc].color === targetColor) toRemove.add(`${rr},${cc}`);
  markAndAnimate(toRemove, 90, []);
  score += toRemove.size * 90;
  await delay(380);
  for (const key of toRemove) {
    const [rr, cc] = key.split(',').map(Number);
    board[rr][cc] = null;
    const cel = getCellEl(rr, cc);
    if (cel) cel.innerHTML = '';
  }
  await applyGravity();
  refillBoard();
  await processMatches();
  updateUI();
  busy = false;
  scheduleHint();
}

async function doShuffle() {
  if (busy) return;
  busy = true;
  const all = [];
  for (let r = 0; r < ROWS; r++)
    for (let c = 0; c < COLS; c++)
      if (board[r][c]) all.push({ color: board[r][c].color, type: board[r][c].type });

  for (let i = all.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [all[i], all[j]] = [all[j], all[i]];
  }

  let k = 0;
  for (let r = 0; r < ROWS; r++)
    for (let c = 0; c < COLS; c++) {
      board[r][c] = createCandy(all[k].color, all[k].type);
      k++;
    }

  renderBoard();
  await processMatches();
  updateUI();
  busy = false;
  scheduleHint();
}

// ═══════════════════════════════════════════════════════════
// HINT SYSTEM
// ═══════════════════════════════════════════════════════════
function scheduleHint() {
  clearHint();
  hintTimeout = setTimeout(showHint, 4500);
}

function clearHint() {
  if (hintTimeout) { clearTimeout(hintTimeout); hintTimeout = null; }
  for (const { r, c } of hintCells) {
    if (board[r] && board[r][c] && board[r][c].el) {
      board[r][c].el.classList.remove('hint');
    }
  }
  hintCells = [];
}

function showHint() {
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const dirs = [[0,1],[1,0]];
      for (const [dr, dc] of dirs) {
        const nr = r+dr, nc = c+dc;
        if (nr >= ROWS || nc >= COLS) continue;

        const tmp = board[r][c];
        board[r][c] = board[nr][nc];
        board[nr][nc] = tmp;
        const { matched } = findMatches();
        board[nr][nc] = board[r][c];
        board[r][c] = tmp;

        if (matched.size > 0) {
          hintCells = [{r, c}, {r: nr, c: nc}];
          for (const hc of hintCells) {
            if (board[hc.r][hc.c] && board[hc.r][hc.c].el) {
              board[hc.r][hc.c].el.classList.add('hint');
            }
          }
          return;
        }
      }
    }
  }
  doShuffle();
}

// ═══════════════════════════════════════════════════════════
// COMBO BANNER
// ═══════════════════════════════════════════════════════════
function showComboBanner(n) {
  const banner = document.createElement('div');
  banner.className = 'combo-banner';
  const labels = ['','','DOUBLE!','TRIPLE!','MEGA!','ULTRA!','INSANE!'];
  banner.textContent = n < labels.length ? labels[n] : `x${n} COMBO!`;
  boardEl.parentNode.appendChild(banner);
  banner.addEventListener('animationend', () => banner.remove(), { once: true });
}

// ═══════════════════════════════════════════════════════════
// UI UPDATE
// ═══════════════════════════════════════════════════════════
function updateUI() {
  document.getElementById('score-display').textContent = score.toLocaleString();
  document.getElementById('best-display').textContent = bestScore.toLocaleString();
  document.getElementById('moves-display').textContent = moves;
  document.getElementById('combo-display').textContent = `x${Math.max(1, combo)}`;
  document.getElementById('level-display').textContent = `Level ${level + 1}`;
  document.getElementById('lives-display').textContent = '❤️'.repeat(lives) + '🖤'.repeat(3 - lives);

  const lvl = LEVELS[level];
  const pct = Math.min(100, (score / lvl.goal) * 100);
  document.getElementById('score-fill').style.width = pct + '%';
  document.getElementById('score-goal-text').textContent = `Goal: ${lvl.goal.toLocaleString()}`;

  const bar = document.getElementById('moves-bar');
  bar.innerHTML = '';
  for (let i = 0; i < lvl.moves; i++) {
    const dot = document.createElement('div');
    dot.className = 'move-dot' + (i >= moves ? ' used' : '');
    bar.appendChild(dot);
  }

  const goalList = document.getElementById('goal-list');
  goalList.innerHTML = '';

  const li0 = document.createElement('li');
  const done0 = score >= lvl.goal;
  li0.innerHTML = `<span class="goal-icon">🎯</span> Score ${lvl.goal.toLocaleString()}
    <span class="goal-progress ${done0 ? 'goal-done' : 'goal-pending'}">${done0 ? '✓' : score.toLocaleString()}</span>`;
  goalList.appendChild(li0);

  for (const [col, target] of Object.entries(lvl.colorGoals)) {
    const li = document.createElement('li');
    const got = colorCounts[col] || 0;
    const done = got >= target;
    li.innerHTML = `<span class="goal-icon candy-${col}" style="background:${['#ff4757','#ffa502','#fffa65','#2ed573','#1e90ff','#a55eea'][col]};border-radius:50%;width:22px;height:22px;display:inline-block;"></span>
      x${target} <span class="goal-progress ${done ? 'goal-done' : 'goal-pending'}">${done ? '✓' : `${got}/${target}`}</span>`;
    goalList.appendChild(li);
  }
}

// ═══════════════════════════════════════════════════════════
// LEVEL INIT
// ═══════════════════════════════════════════════════════════
function startLevel() {
  clearHint();
  busy = false;
  selected = null;
  combo = 0;
  colorCounts = {};
  boostActive = null;
  document.querySelectorAll('.boost-btn').forEach(b => {
    b.classList.remove('active');
    b.style.background = '';
  });

  const lvl = LEVELS[level];
  moves = lvl.moves;
  maxMoves = lvl.moves;
  colorGoals = lvl.colorGoals || {};

  initBoard();
  renderBoard();
  updateUI();
  scheduleHint();
}

function clearSelection() {
  if (selected) {
    const { r, c } = selected;
    board[r] && board[r][c] && board[r][c].el && board[r][c].el.classList.remove('selected');
    selected = null;
  }
}

// ═══════════════════════════════════════════════════════════
// UTILITY
// ═══════════════════════════════════════════════════════════
function delay(ms) { return new Promise(res => setTimeout(res, ms)); }

let touchStart = null;
boardEl.addEventListener('touchstart', e => {
  const t = e.touches[0];
  touchStart = { x: t.clientX, y: t.clientY };
}, { passive: true });

boardEl.addEventListener('touchend', e => {
  if (!touchStart) return;
  const t = e.changedTouches[0];
  const dx = t.clientX - touchStart.x;
  const dy = t.clientY - touchStart.y;
  const absDx = Math.abs(dx), absDy = Math.abs(dy);
  touchStart = null;

  if (Math.max(absDx, absDy) < 20) return;

  const el = document.elementFromPoint(t.clientX, t.clientY);
  const cell = el && el.closest('.cell');
  if (!cell) return;

  const r = parseInt(cell.dataset.r);
  const c = parseInt(cell.dataset.c);
  let tr = r, tc = c;

  if (absDx > absDy) { tc = c + (dx > 0 ? 1 : -1); }
  else { tr = r + (dy > 0 ? 1 : -1); }

  if (tr < 0 || tr >= ROWS || tc < 0 || tc >= COLS) return;
  if (selected) { clearSelection(); }
  trySwap(r, c, tr, tc);
}, { passive: true });

document.addEventListener('keydown', e => {
  if (!selected) return;
  const { r, c } = selected;
  let nr = r, nc = c;
  if (e.key === 'ArrowUp') nr--;
  else if (e.key === 'ArrowDown') nr++;
  else if (e.key === 'ArrowLeft') nc--;
  else if (e.key === 'ArrowRight') nc++;
  else if (e.key === 'Escape') { clearSelection(); return; }
  else return;
  e.preventDefault();
  if (nr < 0 || nr >= ROWS || nc < 0 || nc >= COLS) return;
  clearSelection();
  trySwap(r, c, nr, nc);
});

startLevel();
</script>
